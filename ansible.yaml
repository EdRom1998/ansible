
---
- name: Build WAR on maven
  hosts: maven
  become: yes

  tasks:
    - name: Install Maven, git and JDK
      apt:
        name:
          - maven
          - git
          - python

    - name: Clean build dir
      file:
        path: /opt/edu_ansible
        state: absent

    - name: Create build dir
      file:
        path: /opt/edu_ansible
        state: directory

    - name: Clone and build WAR
      shell: |
        cd /opt/edu_ansible
        git clone https://github.com/sivajavatechie/JenkinsWar .
        mvn package -DskipTests

    - name: Fetch WAR to control node
      fetch:
        src: /opt/edu_ansible/target/JenkinsWar.war
        dest: /tmp/JenkinsWar.war
        flat: yes

- name: Deploy WAR on tomcat
  hosts: tomcat
  become: true

  tasks:
    - name: Install Tomcat
      apt:
        name: tomcat9
        state: present
        update_cache: yes

    - name: Ensure Tomcat started and enabled
      service:
        name: tomcat9
        state: started

    - name: Copy WAR to webapps
      copy:
        src: /tmp/JenkinsWar.war
        dest: /var/lib/tomcat9/webapps/JenkinsWar.war
        owner: tomcat
        group: tomcat

    - name: Restart Tomcat
      service:
        name: tomcat9
        state: restarted
...