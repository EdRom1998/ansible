---
- name: build project with Maven
  hosts: maven
  become: yes

  tasks:
  - name: Delete old directory (if it is exist)
    file:
      path: /opt/edu_ansible
      state: absent

  - name: Create new empty directory
    file:
      path: /opt/edu_ansible
      state: directory

  - name: Install Maven, git and JDK
    apt:
      name:
        - maven
        - git
        - openjdk-21-jdk
      state: present

  - name: run build war file
    shell: |
      cd /opt/edu_ansible
      git clone https://github.com/sivajavatechie/JenkinsWar .
      mvn package -DskipTests
  
- name: Deploy WAR to Tomcat on tomcat host
  hosts: tomcat
  become: true

  tasks:
  - name: Delete old directory (if it is exist)
    file:
      path: /tmp/edu_ansible
      state: absent

  - name: Create new empty directory
    file:
      path: /tmp/edu_ansible
      state: directory

  - name: Install Tomcat
    apt:
      name: tomcat9
      state: present

  - name: Push WAR from maven to tomcat
    synchronize:
      src: /opt/edu_ansible/target/JenkinsWar.war
      dest: adm3@81.26.190.181:/var/lib/tomcat9/webapps/JenkinsWar.war
      mode: push
      private_key: ~/.ssh/id_rsa
    delegate_to: maven

  - name: Install Tomcat
    apt:
      name: tomcat9
      state: restarted
...
    
